<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lingua Play - เกมทายศัพท์น่ารักสำหรับนักศึกษา</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700&family=Noto+Sans+SC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FFF9F3;
      --pastel-pink: #FFB7B2;
      --pastel-peach: #FFDAC1;
      --pastel-yellow: #E2F0CB;
      --pastel-mint: #B5EAD7;
      --pastel-lavender: #C7CEEA;
      --pastel-purple: #9D96CE;
      --text-main: #4A4A68;
      --text-muted: #8E8EA9;
      --white: #FFFFFF;
      --correct: #57CC99;
      --wrong: #FF6B6B;
      --shadow: 0 10px 25px rgba(157, 150, 206, 0.15);
      --card-radius: 28px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Kanit', 'Noto Sans SC', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: linear-gradient(135deg, #FFF0F5 0%, #E6E6FA 50%, #E0F4FF 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      color: var(--text-main);
    }

    .container {
      width: 100%;
      max-width: 480px;
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(12px);
      border-radius: var(--card-radius);
      padding: 28px 22px;
      box-shadow: var(--shadow);
      border: 3px solid #FFF;
      position: relative;
      overflow: hidden;
    }

    /* Screen Management */
    .screen {
      display: none;
      animation: fadeIn 0.35s ease;
    }
    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* Typography & Headers */
    .logo-badge {
      display: inline-block;
      background: var(--pastel-peach);
      color: #9C5134;
      font-size: 13px;
      font-weight: 600;
      padding: 5px 14px;
      border-radius: 20px;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 32px;
      font-weight: 700;
      color: #564F8A;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 15px;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* Section & Cards */
    .section-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      text-align: left;
      margin: 14px 0 8px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 12px;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    /* Custom Selection Buttons */
    .choice-card {
      background: #FAFAFD;
      border: 2px solid #EAEAF5;
      padding: 16px 12px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .choice-card .icon {
      font-size: 26px;
    }

    .choice-card.selected {
      background: #F3EEFF;
      border-color: var(--pastel-purple);
      color: #564F8A;
      box-shadow: 0 4px 14px rgba(157, 150, 206, 0.25);
      transform: translateY(-2px);
    }

    /* Main Action Button */
    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, #A8B5FF 0%, #7E8CE0 100%);
      color: #FFF;
      border: none;
      padding: 15px;
      font-size: 17px;
      font-weight: 600;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(126, 140, 224, 0.35);
      transition: all 0.2s ease;
    }

    .btn-main:active {
      transform: scale(0.98);
    }

    /* Top Bar in Game */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 14px;
      font-weight: 500;
    }

    .badge-info {
      background: #F0F2FA;
      padding: 6px 12px;
      border-radius: 12px;
      color: #5B5A7D;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: #EAEBF5;
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 22px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--pastel-pink), var(--pastel-purple));
      border-radius: 10px;
      transition: width 0.3s ease;
    }

    /* Word Box */
    .question-box {
      background: linear-gradient(135deg, #FFF8F0 0%, #FFF 100%);
      border: 2px dashed #FCD5C5;
      border-radius: 22px;
      padding: 24px 16px;
      text-align: center;
      margin-bottom: 20px;
      min-height: 140px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    .word-main {
      font-size: 38px;
      font-weight: 700;
      color: #3E3B60;
      line-height: 1.2;
    }

    .word-sub {
      font-size: 17px;
      color: #FF8A80;
      font-weight: 500;
      margin-top: 6px;
    }

    /* Answers */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 16px;
    }

    .opt-btn {
      background: var(--white);
      border: 2px solid #ECECF6;
      padding: 13px 18px;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 500;
      color: var(--text-main);
      cursor: pointer;
      text-align: left;
      transition: all 0.2s ease;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .opt-btn:active {
      transform: scale(0.99);
    }

    .opt-btn.correct {
      background: #E8F8F0;
      border-color: var(--correct);
      color: #1F7A54;
      font-weight: 600;
    }

    .opt-btn.wrong {
      background: #FFEBEB;
      border-color: var(--wrong);
      color: #C22D2D;
    }

    .opt-btn:disabled {
      cursor: default;
    }

    /* Explanation Area */
    .explanation-card {
      display: none;
      background: #F4F6FD;
      border-left: 4px solid var(--pastel-purple);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 14px;
      line-height: 1.5;
      text-align: left;
      margin-bottom: 16px;
      animation: fadeIn 0.25s ease;
    }

    /* Result Screen */
    .score-circle {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--pastel-peach) 0%, var(--pastel-pink) 100%);
      margin: 0 auto 18px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #FFF;
      box-shadow: 0 8px 20px rgba(255, 183, 178, 0.45);
    }

    .score-circle .score-num {
      font-size: 38px;
      font-weight: 700;
      line-height: 1;
    }

    .score-circle .score-max {
      font-size: 14px;
      opacity: 0.9;
    }

    .result-stats {
      background: #F8F9FC;
      border-radius: 18px;
      padding: 14px;
      margin-bottom: 22px;
      font-size: 15px;
    }

    .btn-secondary {
      width: 100%;
      background: #F0F0FA;
      color: #636287;
      border: none;
      padding: 13px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 16px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.2s;
    }
  </style>
</head>
<body>

<div class="container">

  <!-- หน้าแรก (Home Screen) -->
  <div id="home-screen" class="screen active text-center">
    <span class="logo-badge">✨ Vocabulary Quiz</span>
    <h1>Lingua Play</h1>
    <p class="subtitle">ท้าประลองศัพท์อังกฤษ & จีน สไตล์นักศึกษา</p>

    <div class="section-title">1. เลือกภาษาที่ต้องการเล่น</div>
    <div class="grid-2">
      <button class="choice-card selected" id="btn-lang-en" onclick="selectLang('en')">
        <span class="icon">🇬🇧</span>
        <span>English</span>
      </button>
      <button class="choice-card" id="btn-lang-zh" onclick="selectLang('zh')">
        <span class="icon">🇨🇳</span>
        <span>中文 (จีน)</span>
      </button>
    </div>

    <div class="section-title">2. เลือกระดับความยาก</div>
    <div class="grid-3">
      <button class="choice-card selected" id="btn-diff-easy" onclick="selectDiff('easy')">
        <span>🌱 ง่าย</span>
      </button>
      <button class="choice-card" id="btn-diff-medium" onclick="selectDiff('medium')">
        <span>🌿 ปานกลาง</span>
      </button>
      <button class="choice-card" id="btn-diff-hard" onclick="selectDiff('hard')">
        <span>🌳 ยาก</span>
      </button>
    </div>

    <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 18px;">
      💡 แต่ละรอบจะสุ่มคำถาม 10 ข้อ จากคลังคำศัพท์
    </div>

    <button class="btn-main" onclick="startGame()">เริ่มเล่นเกมเลย! 🚀</button>
  </div>

  <!-- หน้าเล่นเกม (Game Screen) -->
  <div id="game-screen" class="screen">
    <div class="game-header">
      <span class="badge-info" id="mode-badge">English • ง่าย</span>
      <span class="badge-info" id="q-counter">ข้อที่ 1/10</span>
    </div>

    <div class="progress-bar-container">
      <div id="progress" class="progress-bar"></div>
    </div>

    <div class="question-box">
      <div id="q-word" class="word-main">Presentation</div>
      <div id="q-pinyin" class="word-sub" style="display: none;">jiāo liú</div>
    </div>

    <div class="options-list" id="options-container">
      <!-- ตัวเลือกจะถูกสร้างด้วย JS -->
    </div>

    <div id="explanation-box" class="explanation-card"></div>

    <button id="btn-next" class="btn-main" style="display: none;" onclick="nextQuestion()">ข้อถัดไป ➔</button>
  </div>

  <!-- หน้าผลคะแนน (Result Screen) -->
  <div id="result-screen" class="screen text-center">
    <span class="logo-badge">🎉 จบเกมแล้ว!</span>
    <h2 style="font-size: 26px; color: #564F8A; margin: 10px 0 16px;">ผลคะแนนของคุณ</h2>

    <div class="score-circle">
      <span id="final-score" class="score-num">8</span>
      <span class="score-max">/ 10 คะแนน</span>
    </div>

    <div class="result-stats">
      <p id="result-message" style="font-weight: 600; margin-bottom: 6px; color: #564F8A;">ยอดเยี่ยมมาก!</p>
      <span id="result-detail" style="color: var(--text-muted);">ตอบถูกทั้งหมด 8 จาก 10 ข้อ</span>
    </div>

    <button class="btn-main" onclick="restartGame()">เล่นใหม่อีกรอบ 🔄</button>
    <button class="btn-secondary" onclick="goHome()">กลับหน้าแรก 🏠</button>
  </div>

</div>

<script>
  /* ========================
     1. คลังคำศัพท์ (อย่างน้อย 30 คำต่อภาษา)
     ======================== */
  const VOCAB_DATABASE = {
    en: [
      // ระดับง่าย (Easy) - 12 คำ
      { word: "Campus", options: ["วิทยาเขต / มหาวิทยาลัย", "หอพัก", "ห้องสมุด", "โรงอาหาร"], answer: 0, exp: "Campus หมายถึง บริเวณพื้นที่หรือวิทยาเขตของมหาวิทยาลัย" },
      { word: "Deadline", options: ["วันเริ่มเรียน", "กำหนดส่งงาน", "การสอบย่อย", "ชั่วโมงกิจกรรม"], answer: 1, exp: "Deadline หมายถึง วันหรือเวลาสุดท้ายที่ต้องส่งงาน" },
      { word: "Assignment", options: ["แบบฝึกหัด/งานที่มอบหมาย", "ใบประกาศนียบัตร", "ใบสมัครเรียน", "การเข้าแถว"], answer: 0, exp: "Assignment คืองานหรือการบ้านที่อาจารย์มอบหมายให้ทำ" },
      { word: "Semester", options: ["วันหยุดยาว", "ตารางเรียน", "ภาคการศึกษา", "ปีการศึกษา"], answer: 2, exp: "Semester แปลว่า ภาคการศึกษาหรือเทอม" },
      { word: "Lecture", options: ["การบรรยาย/คาบเรียน", "การสอบสัมภาษณ์", "การเข้าค่าย", "การติวหนังสือ"], answer: 0, exp: "Lecture คือ การบรรยายหรือการเรียนในห้องบรรยาย" },
      { word: "Library", options: ["ห้องสมุด", "ห้องพยาบาล", "ห้องพักอาจารย์", "ร้านเครื่องเขียน"], answer: 0, exp: "Library หมายถึง ห้องสมุด" },
      { word: "Dormitory", options: ["โรงอาหาร", "หอพักนักศึกษา", "สนามฟุตบอล", "หอประชุมใหญ่"], answer: 1, exp: "Dormitory (หรือย่อว่า Dorm) คือ หอพักนักศึกษา" },
      { word: "Tuition", options: ["ค่าประกันของเสียหาย", "ค่าเทอม/ค่าเล่าเรียน", "เงินทุนกู้ยืม", "ค่าชุดนักศึกษา"], answer: 1, exp: "Tuition หรือ Tuition fee หมายถึง ค่าธรรมเนียมการเรียนหรือค่าเทอม" },
      { word: "Schedule", options: ["ตารางเวลา/ตารางสอน", "สมุดจดบันทึก", "คู่มือนักศึกษา", "เกรดเฉลี่ย"], answer: 0, exp: "Schedule แปลว่า กำหนดการหรือตารางเวลาเรียน" },
      { word: "Uniform", options: ["บัตรนักศึกษา", "เครื่องแบบ", "รองเท้าผ้าใบ", "กระเป๋าเป้"], answer: 1, exp: "Uniform หมายถึง เครื่องแบบหรือชุดนักศึกษา" },
      { word: "Review", options: ["ลงทะเบียน", "ทบทวนบทเรียน", "ยกเลิกวิชา", "ขอทุน"], answer: 1, exp: "Review หมายถึง การทบทวนเนื้อหาบทเรียนก่อนสอบ" },
      { word: "Degree", options: ["ปริญญาบัตร", "หน่วยกิต", "เกรดรายวิชา", "ใบเสร็จค่าเทอม"], answer: 0, exp: "Degree หมายถึง ปริญญาทางการศึกษา" },

      // ระดับปานกลาง (Medium) - 10 คำ
      { word: "Internship", options: ["การฝึกงาน", "การทำวิทยานิพนธ์", "การลงทะเบียนล่าช้า", "การลาพักการศึกษา"], answer: 0, exp: "Internship หมายถึง การฝึกงานของนักศึกษาเพื่อเก็บเกี่ยวประสบการณ์" },
      { word: "Curriculum", options: ["ใบรายงานผลการเรียน", "หลักสูตรการศึกษา", "ชมรมกิจกรรม", "วิชาเลือกเสรี"], answer: 1, exp: "Curriculum หมายถึง โครงสร้างหลักสูตรวิชาการ" },
      { word: "Presentation", options: ["การอ่านตำรา", "การนำเสนองาน", "การค้นคว้าเดี่ยว", "การสอบซ่อม"], answer: 1, exp: "Presentation คือ การนำเสนอผลงานหรือรายงานหน้าชั้นเรียน" },
      { word: "Scholarship", options: ["เงินกู้ยืม", "ทุนการศึกษา", "เบี้ยเลี้ยงรายวัน", "ค่าประกันชีวิต"], answer: 1, exp: "Scholarship หมายถึง ทุนการศึกษาที่มอบให้นักศึกษา" },
      { word: "Attendance", options: ["การสอบวัดระดับ", "การเช็กชื่อ/การเข้าเรียน", "การลาป่วย", "การจัดกิจกรรม"], answer: 1, exp: "Attendance หมายถึง การเข้าเรียนหรือการปรากฏตัวในชั้นเรียน" },
      { word: "Prerequisite", options: ["วิชาเลือกเสรี", "วิชาบังคับก่อน", "วิชาเอก", "วิชาศึกษาทั่วไป"], answer: 1, exp: "Prerequisite คือ รายวิชาที่ต้องเรียนผ่านก่อนถึงจะลงวิชาต่อไปได้" },
      { word: "Collaborate", options: ["ทำงานร่วมกัน", "แข่งขันกัน", "ประเมินผล", "แยกย้ายกันทำงาน"], answer: 0, exp: "Collaborate แปลว่า ทำงานร่วมมือร่วมใจกันเป็นทีม" },
      { word: "Transcript", options: ["บัตรห้องสมุด", "ใบแสดงผลการเรียน", "เกียรติบัตร", "จดหมายรับรอง"], answer: 1, exp: "Transcript คือ เอกสารแสดงผลการเรียนหรือใบเกรดทางการ" },
      { word: "Syllabus", options: ["เค้าโครงการสอน/ประมวลรายวิชา", "บัตรประจำตัวสอบ", "ใบรายชื่อผู้เรียน", "รายงานวิจัย"], answer: 0, exp: "Syllabus คือ เอกสารสรุปประมวลการสอนและเกณฑ์คะแนน" },
      { word: "Submission", options: ["การส่งมอบงาน", "การขอถอนรายวิชา", "การยืมหนังสือ", "การชำระเงิน"], answer: 0, exp: "Submission คือ การส่งงานหรือเอกสารให้อาจารย์" },

      // ระดับยาก (Hard) - 10 คำ
      { word: "Dissertation", options: ["วิทยานิพนธ์/ดุษฎีนิพนธ์", "รายงานหน้าเดียว", "บันทึกประจำวัน", "ใบเสร็จลงทะเบียน"], answer: 0, exp: "Dissertation หมายถึง วิทยานิพนธ์ระดับปริญญาเอกหรือการวิจัยขั้นสูง" },

  /* ========================
     2. ตัวแปรสถานะเกม (Game State)
     ======================== */
  let currentLanguage = 'en'; // 'en' | 'zh'
  let currentDifficulty = 'easy'; // 'easy' | 'medium' | 'hard'
  let quizPool = [];
  let currentQuestionIndex = 0;
  let score = 0;
  const TOTAL_QUESTIONS = 10;

  /* ========================
     3. ฟังก์ชันควบคุมหน้าจอและการเลือก
     ======================== */
  function selectLang(lang) {
    currentLanguage = lang;
    document.getElementById('btn-lang-en').classList.toggle('selected', lang === 'en');
    document.getElementById('btn-lang-zh').classList.toggle('selected', lang === 'zh');
  }

  function selectDiff(diff) {
    currentDifficulty = diff;
    document.getElementById('btn-diff-easy').classList.toggle('selected', diff === 'easy');
    document.getElementById('btn-diff-medium').classList.toggle('selected', diff === 'medium');
    document.getElementById('btn-diff-hard').classList.toggle('selected', diff === 'hard');
  }

  function showScreen(screenId) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById(screenId).classList.add('active');
  }

  /* ========================
     4. โลจิกสุ่มคำถามและเริ่มเกม
     ======================== */
  function shuffleArray(arr) {
    const copy = [...arr];
    for (let i = copy.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [copy[i], copy[j]] = [copy[j], copy[i]];
    }
    return copy;
  }

  function startGame() {
    score = 0;
    currentQuestionIndex = 0;

    // กรองคำศัพท์ตามระดับความยาก แต่หากไม่พอ 10 ข้อ จะดึงจากระดับอื่นมาเสริมจนครบ 10
    const fullList = VOCAB_DATABASE[currentLanguage];
    let filtered = [];

    if (currentDifficulty === 'easy') {
      filtered = fullList.slice(0, 12);
    } else if (currentDifficulty === 'medium') {
      filtered = fullList.slice(12, 22);
    } else {
      filtered = fullList.slice(22, 32);
    }

    // สุ่มโจทย์ และสุ่มเลือก 10 ข้อสำหรับรอบนี้
    quizPool = shuffleArray(filtered).slice(0, TOTAL_QUESTIONS);

    // อัปเดตแถบหัวเรื่อง
    const langLabel = currentLanguage === 'en' ? 'English' : '中文 (จีน)';
    const diffMap = { easy: 'ง่าย 🌱', medium: 'ปานกลาง 🌿', hard: 'ยาก 🌳' };
    document.getElementById('mode-badge').innerText = `${langLabel} • ${diffMap[currentDifficulty]}`;

    showScreen('game-screen');
    renderQuestion();
  }

  /* ========================
     5. แสดงผลคำถามและตัวเลือก
     ======================== */
  function renderQuestion() {
    const q = quizPool[currentQuestionIndex];
    document.getElementById('q-counter').innerText = `ข้อที่ ${currentQuestionIndex + 1}/${TOTAL_QUESTIONS}`;
    
    // อัปเดต Progress Bar
    const progressPercent = ((currentQuestionIndex) / TOTAL_QUESTIONS) * 100;
    document.getElementById('progress').style.width = `${progressPercent}%`;

    // ซ่อนคำอธิบายและปุ่มถัดไปก่อน
    const expBox = document.getElementById('explanation-box');
    expBox.style.display = 'none';
    expBox.innerHTML = '';
    document.getElementById('btn-next').style.display = 'none';

    // แสดงคำศัพท์
    document.getElementById('q-word').innerText = q.word;

    // ถ้าเป็นภาษาจีนให้แสดงพินอิน
    const pinyinEl = document.getElementById('q-pinyin');
    if (currentLanguage === 'zh' && q.pinyin) {
      pinyinEl.innerText = q.pinyin;
      pinyinEl.style.display = 'block';
    } else {
      pinyinEl.style.display = 'none';
    }

    // สับตัวเลือกพร้อมจำคำตอบที่ถูกต้อง
    const originalCorrectText = q.options[q.answer];
    const shuffledOptions = shuffleArray(q.options);
    const correctIdxInShuffled = shuffledOptions.indexOf(originalCorrectText);

    // สร้างปุ่มตัวเลือก 4 ปุ่ม
    const optionsContainer = document.getElementById('options-container');
    optionsContainer.innerHTML = '';

    const letters = ['A', 'B', 'C', 'D'];
    shuffledOptions.forEach((optText, index) => {
      const btn = document.createElement('button');
      btn.className = 'opt-btn';
      btn.innerHTML = `<span><strong>${letters[index]}.</strong> ${optText}</span>`;
      btn.onclick = () => handleAnswer(index, correctIdxInShuffled, q.exp);
      optionsContainer.appendChild(btn);
    });
  }

  /* ========================
     6. การตรวจคำตอบและเฉลย
     ======================== */
  function handleAnswer(selectedIndex, correctIndex, explanation) {
    const buttons = document.querySelectorAll('.opt-btn');
    // ปิดการกดซ้ำ
    buttons.forEach(btn => btn.disabled = true);

    const isCorrect = (selectedIndex === correctIndex);
    if (isCorrect) {
      score++;
      buttons[selectedIndex].classList.add('correct');
      buttons[selectedIndex].innerHTML += ' <span>✅</span>';
    } else {
      buttons[selectedIndex].classList.add('wrong');
      buttons[selectedIndex].innerHTML += ' <span>❌</span>';
      buttons[correctIndex].classList.add('correct');
      buttons[correctIndex].innerHTML += ' <span>✅</span>';
    }

    // แสดงการ์ดคำอธิบาย
    const expBox = document.getElementById('explanation-box');
    expBox.innerHTML = `<strong>💡 เกร็ดความรู้:</strong> ${explanation}`;
    expBox.style.display = 'block';

    // เปลี่ยนข้อความปุ่มถ้าเป็นข้อสุดท้าย
    const nextBtn = document.getElementById('btn-next');
    if (currentQuestionIndex === TOTAL_QUESTIONS - 1) {
      nextBtn.innerText = 'ดูผลคะแนน 🏆';
    } else {
      nextBtn.innerText = 'ข้อถัดไป ➔';
    }
    nextBtn.style.display = 'block';
  }

  function nextQuestion() {
    currentQuestionIndex++;
    if (currentQuestionIndex < TOTAL_QUESTIONS) {
      renderQuestion();
    } else {
      showResult();
    }
  }

  /* ========================
     7. หน้าผลคะแนน
     ======================== */
  function showResult() {
    // ปรับ progress เต็ม 100%
    document.getElementById('progress').style.width = '100%';

    document.getElementById('final-score').innerText = score;
    document.getElementById('result-detail').innerText = `ตอบถูกทั้งหมด ${score} จาก ${TOTAL_QUESTIONS} ข้อ`;

    const msgEl = document.getElementById('result-message');
    if (score === 10) {
      msgEl.innerText = "🌟 สุดยอดเพอร์เฟกต์! จำแม่นไร้ที่ติ";
    } else if (score >= 8) {
      msgEl.innerText = "🎉 เก่งมากเลย! ได้คะแนนระดับ A เลยนะ";
    } else if (score >= 5) {
      msgEl.innerText = "💪 ผ่านเกณฑ์พอดี! พยายามอีกนิดจะเก่งขึ้นแน่นอน";
    } else {
      msgEl.innerText = "📖 สู้ๆ นะ! ลองเล่นใหม่อีกรอบเพื่อจำศัพท์ได้ดีขึ้น";
    }

    showScreen('result-screen');
  }

  function restartGame() {
    startGame();
  }

  function goHome() {
    showScreen('home-screen');
  }
</script>
</body>
</html>
